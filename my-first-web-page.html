<!-- Declares that this file uses HTML5. -->
<!DOCTYPE html>

<!-- Opens the HTML document and sets the page language to English. -->
<html lang="en">

<!-- Opens the head section -->
<head>

    <!-- Sets the character encoding so text and symbols display correctly. -->
    <meta charset="UTF-8">

    <!-- Makes the webpage scale properly on phones, tablets, and computers. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Sets the text that appears in the browser tab. -->
    <title>My First Web Page</title>

<!-- Closes the head section. -->
</head>

<!-- Opens the body section. -->
<body>

    <!-- Displays the main heading of the webpage. -->
    <h1>My First Web Page</h1>

    <!-- paragraph content -> username. -->
    <p>Username: mss42</p>

    <!-- paragraph content -> Course name. -->
    <p>Course Name: Intro to Website Development</p>

    <!-- paragraph content -> course number and section. -->
    <p>Course Number and Section: IS117-003</p>

    <!-- Opens the footer section at the bottom of the page. -->
    <footer>

        <!-- Displays the copyright symbol and my name and date. -->
        <p>&copy; Michael Suarez | Due Date: October 3rd 2026</p>

    <!-- Closes the footer section. -->
    </footer>

<!-- Closes the body section. -->
</body>

<!-- Closes the HTML document. -->
</html>
